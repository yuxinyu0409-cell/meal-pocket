function row(title,value,action='',valueAttr=''){return `<${action?'button':'div'} class="row" ${action?`data-action="${action}" ${valueAttr}`:''}><span>${title}</span><span class="trailing">${value}</span>${action?icon('arrow','chevron'):''}</${action?'button':'div'}>`;}
function thumb(r){return `<img class="thumb" src="${esc(r.images[0]||receiptArt())}" alt="${esc(r.merchant||'票据')}的凭证缩略图">`;}
function meal(r){return `<button class="meal" data-action="edit" data-id="${r.id}">${thumb(r)}<span class="meal-info"><b>${esc(r.merchant||'待填写商家')}</b><small class="${r.confirmed?'':'warn'}">${kindLabel(r.kind)} · 晚餐${!r.confirmed?' · '+esc(reviewReasons(r).join('、')||'待补信息'):''}</small></span><span class="meal-price"><strong>${r.cents===null?'待识别':money(r.cents)}</strong><small>实付</small></span></button>`;}
function groupedList(records){if(!records.length)return `<div class="empty-state">${icon('receipt')}<h3>这里还没有票据</h3><p>先收好一张外卖截图或堂食小票。</p><button class="text-button" data-action="tab" data-value="collect">收一张票 →</button></div>`;let out='',last='';for(const r of records){if((r.date||'none')!==last){if(last)out+='</div>';out+=`<p class="date-label">${dayLabel(r.date)}</p><div class="surface">`;last=r.date||'none';}out+=meal(r);}return out+'</div>';}
function folder(kind,count){return `<button class="folder ${kind==='dine'?'purple':''}" data-action="folder" data-value="${kind}" aria-label="${kind==='delivery'?'外卖截图':'堂食小票'}，${count}笔"><span class="folder-back"></span><span class="mini-receipt"><b>${kind==='delivery'?'和府捞面':'社区食堂'}</b><em></em><i></i><i></i><i></i><small>¥36.50</small></span><span class="mini-receipt"><b>GOOD DAY</b><em></em><i></i><i></i><i></i><small>DINNER RECEIPT</small></span><span class="folder-front"><strong>${kind==='delivery'?'外卖截图':'堂食小票'}</strong><span>${count} 笔</span>${icon('arrow')}</span></button>`;}
function home(){let rs=current(),es=eligible();return bar('餐费小袋','',`<button data-action="menu" aria-label="更多与个人资料">${icon('more')}</button>`)+screen(`<div class="headline-row"><h1>${monthLabel()}票夹</h1><button class="month" data-action="months">${state.month.replace('-','.')} ${icon('down')}</button></div><div class="summary"><span class="label">预计可报销</span><div class="money">${money(total(es))}</div><p class="sub">实付 ${money(es.reduce((s,r)=>s+r.cents,0))} · ${rs.length} 笔</p></div><div class="folders">${folder('delivery',rs.filter(r=>r.kind==='delivery').length)}${folder('dine',rs.filter(r=>r.kind==='dine').length)}</div>${drafts().length?`<button class="notice" data-action="pending">${icon('clock')}<span>${drafts().length} 笔待核对</span>${icon('arrow')}</button>`:''}<div class="section-title"><h2>最近收集</h2><button class="text-button" data-action="all">全部 ${icon('arrow','chevron')}</button></div>${groupedList(rs.slice(0,5))}<p class="bottomnote">保留原图，月底统一整理</p>`)+tabs('home');}
function listing(){let rs=current();if(route.kind)rs=rs.filter(r=>r.kind===route.kind);if(route.pending)rs=rs.filter(r=>!r.confirmed||!valid(r));return bar(route.pending?'待核对票据':route.kind?(route.kind==='delivery'?'外卖截图':'堂食小票'):'全部票据','back',`<button data-action="tab" data-value="collect">添加</button>`)+screen(`<p class="sub" style="margin:8px 0 20px">${fullMonth()} · ${rs.length} 笔</p>${route.pending&&!rs.length?`<div class="empty-state">${icon('check')}<h3>待核对已全部补齐</h3><p>票据已自动归入对应票夹。</p><button class="text-button" data-action="tab" data-value="home">返回票夹 →</button></div>`:groupedList(rs)}`);}
function collect(){return bar('收集票据','',`<button data-action="all">票夹</button>`)+screen(`<h1>收一张票</h1><p class="sub" style="margin-top:8px">选好类型，剩下的交给票夹</p><div class="segment"><button class="${importKind==='delivery'?'selected':''}" data-action="kind" data-value="delivery">外卖截图</button><button class="${importKind==='dine'?'selected':''}" data-action="kind" data-value="dine">堂食小票</button></div><div class="collect-art"><div class="paper"><b>${importKind==='delivery'?'和府捞面':'社区食堂'}</b><p>DINNER RECEIPT<br>餐费消费凭证<br>————————<br>一餐一票，随手收好</p><strong>¥36.50</strong></div><div class="paper"><b>Good Food<br>Good Day</b><p>记录每一次晚餐<br>月底一起整理</p><strong>RECEIPT</strong></div></div><button class="primary" data-action="pick-receipt">${icon('image')}从相册添加</button>${importKind==='dine'?`<button class="secondary" data-action="camera" style="margin-top:10px">${icon('camera')}拍摄小票</button>`:''}<div class="upload-area"><span>上传后，识别完整就自动入票夹</span><button class="text-button" data-action="sample-receipt">体验自动识别入夹 →</button><button class="text-button" data-action="sample-incomplete">体验识别不完整 →</button></div><h2>多图如何整理</h2><div class="surface"><button class="row" data-action="group-mode"><span>多张图属于同一笔消费</span><span class="trailing">${groupMode?'合为一笔':'每图单独保存'}</span>${icon(groupMode?'check':'plus','small-icon')}</button></div><p class="helper">一笔消费的订单、付款截图可以放在一起；不同消费请分开保存。</p><p class="bottomnote">${icon('lock')} 原图保存在当前浏览器</p>`)+tabs('collect');}
function beginEdit(id,fromReport=false){const r=state.records.find(r=>r.id===id);if(!r)return;draft={...copy(r),amount:r.cents===null?'':currency(r.cents),endTime:state.times[r.date]||'',lodging:state.lodging[r.date]?currency(state.lodging[r.date]):'',dirty:false,amountEditing:false};returnRoute=fromReport?'report':null;go('edit',{id});}
function edit(){if(!draft)return home();let d=draft;return bar(d.confirmed?'票据详情':'补全票据信息','back',`<button data-action="save-record" data-value="confirm">保存</button>`)+screen(`<div class="surface"><label class="row"><span>消费日期</span><input aria-label="消费日期" type="date" value="${esc(d.date)}" data-field="date" required></label></div><div class="receipt-preview">${thumb(d)}<div><b>${esc(d.merchant||'待核对票据')}</b><p class="sub">${kindLabel(d.kind)} · ${d.images.length} 张原图</p><button data-action="originals">查看原图 ${icon('arrow','chevron')}</button></div></div>${!d.confirmed?`<div class="error">待补：${esc(reviewReasons({...d,cents:cents(d.amount)}).join('、')||'请补齐票据信息')}</div>`:''}<h2>费用信息</h2><div class="surface"><label class="row"><span>商家名称</span><input aria-label="商家名称" data-field="merchant" value="${esc(d.merchant)}" placeholder="填写商家"></label>${amountMarkup(d)}<label class="row"><span>票据类型</span><select data-field="kind" aria-label="票据类型"><option value="delivery" ${d.kind==='delivery'?'selected':''}>外卖截图</option><option value="dine" ${d.kind==='dine'?'selected':''}>堂食小票</option></select></label><div class="row"><span>当日晚餐餐补</span><strong id="draft-cap">${draftCap()}</strong></div></div><p class="helper">按当天晚餐实付合计，最高 ¥30；同日不重复申报。</p><h2>加班信息</h2><div class="surface"><label class="row">${icon('clock','small-icon')}<span>加班结束时间</span><input aria-label="加班结束时间" data-field="endTime" type="time" value="${esc(d.endTime)}"></label></div><p class="helper">手动填写，同一天的票据共用此时间。可先保存，月底补齐。</p><h2>其他信息</h2><div class="surface"><label class="row"><span>住宿费（选填）</span><input aria-label="住宿费" data-field="lodging" inputmode="decimal" value="${esc(d.lodging)}" placeholder="无"></label><label class="row"><span>备注</span><input aria-label="备注" data-field="note" value="${esc(d.note)}" placeholder="选填"></label></div><p class="helper">涉及住宿时，请补充对应凭证；同日共用一笔住宿费。</p><div id="edit-error" role="alert"></div><div class="section-title"><h2>原始凭证</h2><button class="text-button" data-action="supplement">补图 +</button></div><div class="originals">${d.images.map((src,i)=>`<button data-action="original" data-value="${i}"><img src="${esc(src)}" alt="凭证${i+1}"><small>凭证 ${i+1}</small></button>`).join('')}</div><button class="text-button trash" data-action="delete-record">${icon('trash')} 移入最近删除</button>`)+`<div class="footer-actions">${!d.confirmed?'<button class="secondary" data-action="save-record" data-value="draft">暂存</button>':''}<button class="primary" data-action="save-record" data-value="confirm">${returnRoute==='report'?'保存并返回检查':'保存'}</button></div>`;}
function amountMarkup(d){const c=cents(d.amount);const hasAmount=c!==null;let hint=hasAmount?(d.amountManual?'金额已手动修改':d.ocrSource==='total'?'根据票据合计识别，请核对是否为实付金额':d.ocrStatus==='recognized'?'实付金额已自动识别':'请核对实付金额'):(d.ocrStatus==='failed'?'未能识别实付金额，可手动补填':'待识别实付金额');return `<div class="row"><span>实付金额</span>${d.amountEditing?`<input class="manual-amount" aria-label="实付金额" data-field="amount" inputmode="decimal" value="${esc(d.amount)}" placeholder="填写实付金额">`:`<span class="amount-display"><strong>${hasAmount?money(c):d.ocrStatus==='failed'?'未识别':'待识别'}</strong><button data-action="edit-amount">${hasAmount?'修改':'手动输入'}</button></span>`}</div><p class="amount-hint" id="amount-hint">${hint}</p>`;}
function draftCap(){const c=cents(draft.amount);if(c===null||!draft.date)return '待识别';const others=state.records.filter(r=>!r.deleted&&r.id!==draft.id&&r.date===draft.date&&r.confirmed&&valid(r));return money(dinner([...others,{...draft,cents:c}]))}
function saveRecord(confirm){let error='';const c=cents(draft.amount), l=draft.lodging===''?0:cents(draft.lodging);if(draft.amount!==''&&c===null)error='实付金额请输入非负数字，最多两位小数。';else if(l===null)error='住宿费请输入有效金额，最多两位小数。';else if(draft.endTime&&!validTime(draft.endTime))error='结束时间请填写为 HH:mm，例如 22:05。';else if(confirm&&(!draft.merchant.trim()||!validDate(draft.date)||c===null||!draft.images.length))error='请补齐商家、消费日期、实付金额和原图。';if(error){$('#edit-error').innerHTML=`<div class="error">${error}</div>`;$('#edit-error').scrollIntoView({block:'nearest'});return;}let record={...state.records.find(r=>r.id===draft.id),id:draft.id,ocrStatus:draft.ocrStatus,ocrSource:draft.ocrSource,ocrConflicts:draft.ocrConflicts,amountManual:!!draft.amountManual,merchant:draft.merchant.trim(),date:draft.date,kind:draft.kind,cents:c,note:draft.note,images:draft.images,confirmed:confirm,importMonth:draft.importMonth||state.month};refreshAdmission(record);confirm=record.confirmed;let idx=state.records.findIndex(r=>r.id===record.id);if(idx<0)state.records.push(record);else state.records[idx]=record;if(record.date){state.times[record.date]=draft.endTime;state.lodging[record.date]=l;}ensureSelection();if(confirm)mark('edit');if(draft.endTime)mark('time');log(`${formatDate(record.date)} · ${confirm?'已录入':'待补'}${record.merchant}`);const to=returnRoute;draft=null;returnRoute=null;persist();if(to==='report'){route={view:'report'};stack=[];render();toast('已保存，同日票据的结束时间已同步。');}else{route=stack.pop()||{view:'home'};if(route.view==='collect')route={view:'home'};render();toast(confirm?'已录入票夹。':'已暂存到待核对，补齐后自动录入。');}}
function profile(){let p=profileDraft||state.profile;return bar('个人资料','back',`<button data-action="save-profile">保存</button>`)+screen(`<h1 style="font-size:24px;margin-top:20px">报销用的，都是本人信息</h1><p class="sub" style="margin:12px 0 28px">填写一次，每份报销明细自动带入。</p><div class="surface"><label class="row"><span>本人姓名</span><input data-profile="name" aria-label="本人姓名" autocomplete="name" value="${esc(p.name)}" placeholder="填写姓名"></label><label class="row"><span>所属部门</span><input data-profile="department" aria-label="所属部门" value="${esc(p.department)}" placeholder="填写部门"></label></div><p class="helper">修改后用于新生成的报销材料，已生成的历史报销包保持原样。</p><div id="profile-error" role="alert"></div><p class="bottomnote">${icon('lock')} 资料仅保存在当前浏览器</p>`)+`<div class="footer-actions"><button class="primary" data-action="save-profile">保存个人资料</button></div>`;}
function openProfile(){profileDraft=copy(state.profile);go('profile');}
function report(){ensureSelection();let rs=selected(),m=missing(),ds=drafts(),ready=rs.length&&!m.length&&!ds.length&&completeProfile(),n=m.length+ds.length+(!completeProfile()?1:0);return bar('月底整理','',`<button data-action="months">${icon('down')}</button>`)+screen(`<button class="text-button" data-action="months">${fullMonth()} ${icon('down','chevron')}</button><div class="report-summary"><b>已选 ${rs.length} 笔票据</b><div><strong>${money(total(rs))}</strong><p>申请报销金额</p></div></div><div class="section-title"><h2>材料检查</h2><span class="badge">${n?n+' 项待补':'已齐全'}</span></div><div class="surface checklist"><button class="row" data-action="check-receipts">${check(!ds.length)}<span>餐费票据</span><span class="trailing">${ds.length?ds.length+' 笔待核对':eligible().length+' 笔已录入'}</span>${icon('arrow','chevron')}</button><button class="row" data-action="check-times">${check(!m.length)}<span>加班结束时间</span><span class="trailing">${m.length?m.length===1?formatDate(m[0])+'待填写':m.length+' 个日期待填写':rs.length?'已补齐':'先选择票据'}</span>${icon('arrow','chevron')}</button><button class="row" data-action="invoices">${check(invoices().length>0)}<span>餐饮发票</span><span class="trailing">${invoices().length?invoices().length+' 份已添加':'按需添加'}</span>${icon('arrow','chevron')}</button><button class="row" data-action="profile">${check(!!completeProfile())}<span>本人报销资料</span><span class="trailing">${completeProfile()?esc(state.profile.name)+' · '+esc(state.profile.department):'填写姓名、部门'}</span>${icon('arrow','chevron')}</button></div>${n?`<p class="helper">点开待补项，补齐后会回到这里。</p>`:''}<div class="section-title"><h2>本次报销范围</h2><button class="text-button" data-action="selection">${rs.length} / ${eligible().length} 笔 ${icon('arrow','chevron')}</button></div><div class="surface">${row('纳入票据',rs.length+' 笔 · '+groups(rs).length+' 天','selection')}${row('票据排版','外卖、堂食分章节','layout')}${row('住宿费用',lodging(rs)?money(lodging(rs)):'本月无','lodging-info')}</div><p class="selection-summary">${eligible().length-rs.length} 笔已录入票据未纳入。晚餐餐补同日合计最高 ¥30。</p><div class="lavender-note">生成后包含：Excel 明细、票据 PDF、发票原件</div><button class="primary" data-action="generate" ${ready?'':'disabled'}>${ready?'生成报销包':!rs.length?'先收集并核对票据':'补齐后生成报销包'}</button><button class="text-button" style="width:100%;padding:12px" data-action="history">历史导出</button>`)+tabs('report');}
function timeList(){let dates=groups(selected());return bar('加班结束时间')+screen(`<p class="sub" style="margin:10px 0 22px">按消费日期补填，同一天只填一次。</p><div class="surface">${dates.map(([d,rs])=>`<button class="row" data-action="edit-time" data-id="${rs[0].id}">${check(validTime(state.times[d]))}<span>${formatDate(d)}</span><span class="trailing">${esc(state.times[d]||'待填写')}</span>${icon('arrow','chevron')}</button>`).join('')}</div>${!dates.length?`<div class="empty-state">${icon('clock')}<h3>还没有纳入报销的日期</h3><p>先选择已录入票据。</p></div>`:''}`);}
function selectView(){let es=eligible();return bar('选择本次票据','back',`<button data-action="all-select">${selected().length===es.length?'取消全选':'全选'}</button>`)+screen(`<p class="sub" style="margin:8px 0 18px">仅信息齐全的票据可纳入。已提交的记录默认不选，可手动重新导出。</p><div class="surface">${es.map(r=>`<button class="select-row" data-action="toggle-selection" data-id="${r.id}" aria-pressed="${state.selected.includes(r.id)}"><span class="check ${state.selected.includes(r.id)?'':'empty'}">${state.selected.includes(r.id)?icon('check'):''}</span><div>${esc(r.merchant)}<small>${formatDate(r.date)} · ${kindLabel(r.kind)}${r.submitted?' · 已标记提交':''}</small></div><b>${money(r.cents)}</b></button>`).join('')}</div><p class="helper">金额按选中记录的消费日期汇总，同日餐补不重复计算。</p>`)+`<div class="footer-actions"><button class="primary" data-action="selection-done">纳入 ${selected().length} 笔 · ${money(total(selected()))}</button></div>`;}
function invoiceView(){return bar('餐饮发票','back',`<button data-action="pick-invoice">添加</button>`)+screen(`<p class="sub" style="margin:10px 0 20px">${fullMonth()} · ${invoices().length} 份原件</p><div class="surface">${invoices().map(i=>`<div class="row">${icon('doc','small-icon')}<button style="text-align:left;flex:1;font-size:12px;overflow-wrap:anywhere" data-action="view-invoice" data-id="${i.id}">${esc(i.name)}</button><button data-action="remove-invoice" data-id="${i.id}" aria-label="移除${esc(i.name)}">${icon('trash','small-icon')}</button></div>`).join('')}</div><div class="invoice-entry">${icon('doc')}<b>原文件，原样保留</b><p class="sub">添加电子发票 PDF，或发票图片。</p><button class="primary" data-action="pick-invoice">${icon('plus')}添加发票原件</button><button class="text-button" data-action="sample-invoice" style="margin-top:8px">用一份示例发票体验 →</button></div><p class="helper">发票按月份归档。是否满足公司要求，仍需你核对。移除当前原件，不影响已生成的历史报销包。</p>`);}
function generated(){const r=state.reports.find(r=>r.id===route.id);if(!r)return home();return bar('报销包已生成','back')+screen(`<p class="generated-month">${fullMonth(r.month)}</p><div class="success"><div class="success-icon">${icon('check')}</div><h1>${monthLabel(r.month)}报销包已生成</h1><p class="sub">2 份汇总文件 · ${r.invoices.length} 份发票原件</p></div><h2 style="margin-top:0">汇总文件</h2><div class="surface">${fileRow('xlsx',monthLabel(r.month)+'报销明细.xlsx','日期、晚餐餐补、加班结束时间','preview-xlsx')}${fileRow('pdf',monthLabel(r.month)+'餐费票据.pdf','外卖、堂食分章节','preview-pdf')}</div>${r.invoices.length?`<h2>发票原件</h2><div class="surface">${r.invoices.map(i=>fileRow('invoice',i.name,'保留原文件','report-invoice',i.id)).join('')}</div>`:''}<button class="primary" style="margin-top:20px" data-action="share">${icon('share')}下载 ZIP 报销包</button><button class="secondary" style="margin-top:10px" data-action="tab" data-value="home">返回票夹</button><p class="bottomnote">${r.submitted?'已手动标记提交':'材料准备完成，需自行提交公司报销'}</p><button class="text-button" style="width:100%;margin-top:8px" data-action="submitted">${r.submitted?'撤销提交标记':'已自行提交？手动标记'}</button>`)+tabs('report');}
function fileRow(type,name,sub,action,id=''){return `<button class="file-row" data-action="${action}" ${id?`data-id="${id}"`:''}><span class="file-glyph ${type==='xlsx'?'green':type==='pdf'?'pink':''}">${icon('doc')}</span><span class="file-text"><b>${esc(name)}</b><small>${sub}</small></span><span class="file-action">${type==='invoice'?icon('eye'):'预览'}</span></button>`;}
function history(){return bar('历史导出')+screen(`<p class="sub" style="margin:10px 0 20px">每次生成都会保存独立快照。</p>${state.reports.length?`<div class="surface">${state.reports.map(r=>`<button class="history-row" data-action="open-report" data-id="${r.id}"><b>${fullMonth(r.month)} · ${money(r.total)}</b><small>${r.records.length} 笔 · ${r.created} · ${r.submitted?'已手动标记提交':'尚未标记提交'}</small></button><button class="text-button" style="padding:8px 16px;color:#a65353" data-action="delete-report" data-id="${r.id}">删除报销包</button>`).join('')}</div>`:`<div class="empty-state">${icon('doc')}<h3>还没有报销包</h3><p>生成后，文件会在这里保留。</p></div>`}`);}
function trashView(){let rs=state.records.filter(r=>r.deleted);return bar('最近删除')+screen(`<p class="sub" style="margin:10px 0 20px">误删的票据可在这里恢复。</p><div class="surface">${rs.map(r=>`<div class="row"><span>${esc(r.merchant||'未命名票据')}</span><button class="text-button" data-action="restore-record" data-id="${r.id}">恢复</button></div>`).join('')}</div>${rs.length?'':`<div class="empty-state">${icon('trash')}<h3>暂无删除记录</h3></div>`}`);}

function currentReport(){return state.reports.find(r=>r.id===route.id);}
function detailTable(r){return `<div class="document"><h3>晚餐报销明细</h3><p>${fullMonth(r.month)}<br>报销人：${esc(r.profile.name)}　部门：${esc(r.profile.department)}</p><table><thead><tr><th style="width:22%">日期</th><th style="width:27%">结束时间</th><th>晚餐餐补</th><th>住宿费</th></tr></thead><tbody>${groups(r.records).map(([d,rs])=>`<tr><td>${d.slice(5).replace('-','/')}</td><td>${esc(r.times[d])}</td><td>${currency(dinner(rs))}</td><td>${currency(r.lodging[d]||0)}</td></tr>`).join('')}<tr><td>合计</td><td></td><td>${currency(dinner(r.records))}</td><td>${currency(groups(r.records).reduce((s,[d])=>s+(r.lodging[d]||0),0))}</td></tr></tbody></table><p style="margin-top:18px">申请报销金额：${money(r.total)}<br>晚餐餐补每日最高 ¥30；同日仅申报一次。<br>下载 ZIP 可获取对应的真实 Excel 文件。</p></div>`;}
function pdfContent(r){return ['delivery','dine'].map(kind=>{const items=r.records.filter(x=>x.kind===kind).sort((a,b)=>a.date.localeCompare(b.date)).flatMap(x=>x.images.map(src=>({x,src})));return Array.from({length:Math.ceil(items.length/4)},(_,page)=>`<div class="document pdf-page"><h3>${kindLabel(kind)}票据</h3><p>${fullMonth(r.month)} · ${esc(r.profile.name)}</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">${items.slice(page*4,page*4+4).map(({x,src})=>`<div><img class="doc-image" style="width:100%;height:220px;object-fit:contain" src="${esc(src)}" alt="${esc(x.merchant)}原始凭证"><p>${esc(x.merchant)}<br>${esc(x.date)} · ${money(x.cents)}</p></div>`).join('')}</div></div>`).join('');}).join('');}
function invoiceContent(i){if(i.demo)return `<div class="document"><h3>餐饮电子发票 · 示例</h3><p>这是一份用于体验流程的示例原件。真实使用时，保留你上传的 PDF 或图片。</p><img class="doc-image" src="${receiptArt('示例餐饮发票',80,true)}" alt="示例发票"><p>非真实发票，不可用于报销。</p></div>`;if(i.data?.startsWith('data:image/'))return `<div class="document"><img class="doc-image" src="${esc(i.data)}" alt="发票原图"></div>`;return `<div class="document"><h3>${esc(i.name)}</h3><p>已保留上传的 PDF 原文件。部分浏览器无法内嵌 PDF，可单独打开查看。</p><button class="secondary" data-action="open-pdf-original" style="margin-top:20px">打开 PDF 原件</button></div>`;}
function previewMarkup(){let title='',body='';if(preview.type==='xlsx'){title='报销明细预览';body=detailTable(currentReport());}else if(preview.type==='pdf'){title='票据排版预览';body=pdfContent(currentReport());}else if(preview.type==='original'){title='原始凭证';body=`<div class="document"><img class="doc-image" style="max-height:none" src="${esc(preview.src)}" alt="原始票据"></div>`;}else{title='发票原件';body=invoiceContent(preview.invoice);}return `<section class="preview-sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="status" style="height:52px;min-height:52px"></div>${bar(title,'',`<button data-action="close-preview">完成</button>`)}<div class="screen" style="padding:0 10px 25px">${body}</div></section>`;}
function updateOutside(){const steps=[['collect','收好票据','外卖、堂食分开收集'],['edit','自动录入票据','识别完整，无需逐笔确认'],['time','手填加班结束时间','同一天，多张票据共用'],['report','月底补齐材料','核对时间、本人资料与发票'],['generated','生成报销包','查看明细、票据及发票原件']];$('#journey').innerHTML=steps.map(([k,t,s],i)=>`<li class="${state.visited.includes(k)?'done':''}"><i>${state.visited.includes(k)?'✓':i+1}</i>${t}<span>${s}</span></li>`).join('');$('#activity').innerHTML=state.log.length?'<p>最近体验</p>'+state.log.slice(0,3).map(s=>`<p>· ${esc(s)}</p>`).join(''):'';if(document.activeElement!==$('#feedback'))$('#feedback').value=state.feedback||'';}
function renderExportStatus(){let el=document.querySelector('#export-status');if(!el){el=document.createElement('div');el.id='export-status';document.querySelector('.glass').append(el);}el.hidden=!exportStatus;el.innerHTML=exportStatus?`<span>${esc(exportStatus)}</span>${completedReportID?`<button data-action="open-report" data-id="${completedReportID}">查看结果 →</button>`:''}`:'';}
async function buildReport(r){if(exporting){toast('已有报销包正在生成，稍后可查看。');return;}exporting=true;completedReportID=null;exportStatus='正在生成报销包，可继续浏览…';sheet=null;renderOverlay();renderExportStatus();try{await new Promise(resolve=>setTimeout(resolve,0));const files=await MealExport.build(r);exportedFiles.set(r.id,files);state.reports.unshift(r);persist();mark('generated');completedReportID=r.id;exportStatus='报销包已生成，支持下载 PDF + Excel ZIP';log(`${fullMonth(r.month)} · 已生成真实报销材料`);}catch(e){exportStatus='生成失败，请检查票据后重试';toast(e.message||'生成失败，请重试。');}finally{exporting=false;renderExportStatus();}}
function generate(){ensureSelection();if(!selected().length||missing().length||drafts().length||!completeProfile()){toast('请先补齐待处理的信息。');return;}const r={id:uid(),month:state.month,records:copy(selected()),profile:copy(state.profile),times:copy(state.times),lodging:copy(state.lodging),invoices:copy(invoices()),total:total(selected()),created:new Date().toLocaleString('zh-CN'),submitted:false};buildReport(r);}
function quickDemo(){const demo=fresh();demo.records[3].cents=2200;demo.records[3].confirmed=true;demo.times={'2026-10-25':'21:45','2026-10-26':'22:10','2026-10-27':'22:05'};const r={id:uid(),month:demo.month,records:demo.records,profile:demo.profile,times:demo.times,lodging:{},invoices:[],total:dinner(demo.records),created:new Date().toLocaleString('zh-CN'),submitted:false};buildReport(r);toast('正在用示例票据生成真实报销包，不会改动你的票夹。');}
async function downloadReport(type){const r=currentReport();if(!r)return;if(exporting){toast('正在生成文件，请稍候。');return;}exporting=true;sheet=null;renderOverlay();toast('正在准备下载…');try{let files=exportedFiles.get(r.id);if(!files){files=await MealExport.build(r);exportedFiles.set(r.id,files);}const types={pdf:'application/pdf',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',zip:'application/zip'};MealExport.download(type==='zip'?files.zip:new Blob([files[type]],{type:types[type]}),`${r.month}${type==='zip'?'报销包':type==='pdf'?'餐费票据':'报销明细'}.${type}`);toast('文件已交给浏览器下载，请查看下载列表。');}catch(e){toast(e.message||'下载失败，请重试。');}finally{exporting=false;}}
function addSample(incomplete=false){sheet=null;mark('collect');const r={id:uid(),merchant:importKind==='delivery'?'和府捞面':'社区食堂',date:today,kind:importKind,cents:importKind==='delivery'?3650:2200,note:'',confirmed:false,ocrStatus:'recognized',ocrSource:'paid',images:[receiptArt(importKind==='delivery'?'和府捞面':'社区食堂',importKind==='delivery'?36.5:22)]};if(incomplete){r.cents=null;r.ocrStatus='failed';}refreshAdmission(r);state.records.push(r);state.month=r.date.slice(0,7);persist();if(r.confirmed)mark('edit');log(incomplete?'有1笔实付金额未识别':'示例票据已自动识别录入');tab('home');toast(incomplete?'已保存原图，1笔实付金额未识别，已放入待核对。':'已自动识别并录入票夹，无需手动确认。');}
const readFile=file=>new Promise((resolve,reject)=>{const reader=new FileReader;reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('读取文件失败'));reader.readAsDataURL(file);});
async function importReceipts(files){if(!files.length)return;try{if(files.some(f=>!f.type.startsWith('image/')))throw Error('票据请选择图片格式。');if(files.some(f=>f.size>3*1024*1024))throw Error('请使用3MB以内的图片。');let imgs=await Promise.all(files.map(readFile));if(receiptSource==='supplement'&&draft){draft.images.push(...imgs);draft.dirty=true;sheet=null;render();toast('已追加凭证，保存后生效。');return;}const imageGroups=groupMode?[imgs]:imgs.map(i=>[i]);const fileGroups=groupMode?[files]:files.map(f=>[f]);const records=imageGroups.map(images=>({id:uid(),merchant:'',date:'',importMonth:state.month,kind:importKind,cents:null,note:'',confirmed:false,ocrStatus:'pending',images}));state.records.push(...records);persist();mark('collect');log(`已收好 ${files.length} 张图片`);await recognizeRecords(records,fileGroups);}catch(e){toast(e.message)}}
function finishRecognition(records){const admitted=records.filter(r=>r.confirmed).length,failed=records.length-admitted;const dated=records.find(r=>r.date);if(dated)state.month=dated.date.slice(0,7);state.selectionTouched=false;ensureSelection();persist();if(admitted)mark('edit');tab('home');log(`自动录入${admitted}笔${failed?' · '+failed+'笔待补':''}`);toast(failed?`${admitted?'已自动录入'+admitted+'笔；':''}${failed}笔信息未识别，已放入待核对。`:`已自动识别并录入${admitted}笔票据。`);}
function recognitionOverlay(current,count){$('#overlays').innerHTML=`<div class="busy-cover" role="status"><div><div class="progress-ring"></div><h3>正在识别票据 ${current}/${count}</h3><p>自动查找商家、消费日期和实付金额<br>原图已先保存，识别失败也不会丢失</p><button class="text-button" style="margin-top:25px" data-action="manual-ocr">先手动填写 →</button></div></div>`;}
async function recognizeRecords(records,fileGroups){if(!['127.0.0.1','localhost'].includes(location.hostname)){records.forEach(r=>{r.ocrStatus='failed';refreshAdmission(r);});persist();finishRecognition(records);toast('图片已保存在浏览器。公开体验版请手动补填，或使用示例票据体验识别结果。');return;}const job={controller:new AbortController(),records};recognitionJob=job;try{for(let n=0;n<records.length;n++){if(recognitionJob!==job)return;recognitionOverlay(n+1,records.length);const results=[];for(const file of fileGroups[n]){if(recognitionJob!==job)return;try{const requestController=new AbortController();const abort=()=>requestController.abort();job.controller.signal.addEventListener('abort',abort,{once:true});const timeout=setTimeout(abort,25000);try{const response=await fetch('/api/recognize',{method:'POST',body:file,headers:{'Content-Type':file.type||'application/octet-stream'},signal:requestController.signal});if(!response.ok)throw Error('识别暂不可用');const result=await response.json();if(!result.error)results.push(result);}finally{clearTimeout(timeout);job.controller.signal.removeEventListener('abort',abort);}}catch{}}if(recognitionJob!==job)return;const record=records[n];record.merchant=results.find(r=>r.merchant)?.merchant||'';const dates=[...new Set(results.map(r=>r.date).filter(Boolean))];record.date=dates.length===1?dates[0]:'';record.ocrConflicts={date:dates.length>1};let paid=results.filter(r=>Number.isInteger(r.amountCents)&&r.amountSource==='paid');let usable=paid.length?paid:results.filter(r=>Number.isInteger(r.amountCents));const amounts=[...new Set(usable.map(r=>r.amountCents))];record.cents=amounts.length===1?amounts[0]:null;record.ocrConflicts.amount=amounts.length>1||results.some(r=>(r.candidates||[]).length>1);record.ocrStatus=record.cents!==null?'recognized':'failed';record.ocrSource=usable[0]?.amountSource||'';record.amountManual=false;refreshAdmission(record);persist();}if(recognitionJob!==job)return;recognitionJob=null;finishRecognition(records);}catch{if(recognitionJob===job){recognitionJob=null;records.forEach(r=>{if(r.cents===null)r.ocrStatus='failed';});records.forEach(refreshAdmission);persist();finishRecognition(records);}}}

async function importInvoices(files){if(!files.length)return;try{if(files.some(f=>!f.type.startsWith('image/')&&f.type!=='application/pdf'))throw Error('发票支持 PDF 或图片。');if(files.some(f=>f.size>3*1024*1024))throw Error('请使用3MB以内的发票文件。');let data=await Promise.all(files.map(readFile));data.forEach((d,i)=>state.invoices.push({id:uid(),month:invoiceMonth||state.month,name:files[i].name,data:d,demo:false}));persist();render();toast(`已保存 ${files.length} 份发票原件。`);}catch(e){toast(e.message)}}
function openInvoice(i){sheet=null;preview={type:'invoice',invoice:i};renderOverlay();}
function dispatch(action,el){const val=el?.dataset.value,id=el?.dataset.id;
switch(action){
case'tab':tab(val);if(val==='collect')mark('collect');if(val==='report')mark('report');break;
case'menu':sheet={type:'menu'};renderOverlay();break;
case'back':back();break;
case'all':go('list');break;
case'pending':go('list',{pending:true});break;
case'folder':go('list',{kind:val});break;
case'months':sheet={type:'months'};renderOverlay();break;
case'year':sheet.year=(sheet.year??Number(state.month.slice(0,4)))+Number(val);renderOverlay();break;
case'month':state.month=val;state.selectionTouched=false;ensureSelection();sheet=null;persist();render();break;
case'edit':beginEdit(id,route.view==='report');break;
case'edit-time':sheet=null;beginEdit(id,true);break;
case'kind':importKind=val;render();break;
case'group-mode':groupMode=!groupMode;render();break;
case'pick-receipt':receiptSource='upload';sheet=null;$('#receipt-files').value='';$('#receipt-files').click();renderOverlay();break;
case'sample-receipt':addSample();break;
case'sample-incomplete':addSample(true);break;
case'camera':sheet={type:'camera'};renderOverlay();break;
case'supplement':sheet={type:'supplement'};renderOverlay();break;
case'pick-supplement':receiptSource='supplement';sheet=null;$('#receipt-files').value='';$('#receipt-files').click();renderOverlay();break;
case'sample-supplement':draft.images.push(receiptArt('付款凭证',Number(draft.amount)||36.5));draft.dirty=true;sheet=null;render();break;
case'edit-amount':draft.amountEditing=true;{const pos=$('#screen').scrollTop;render();$('#screen').scrollTop=pos;const field=$('[data-field="amount"]');if(field)field.focus();}break;
case'manual-ocr':{const job=recognitionJob;if(!job)break;recognitionJob=null;job.controller.abort();job.records.forEach(r=>{if(r.cents===null)r.ocrStatus='failed';});job.records.forEach(refreshAdmission);persist();finishRecognition(job.records);break;}
case'save-record':saveRecord(val!=='draft');break;
case'originals':sheet={type:'originals'};renderOverlay();break;
case'original':preview={type:'original',src:draft.images[Number(val)]};renderOverlay();break;
case'discard':draft=null;sheet=null;route=stack.pop()||{view:'home'};render();break;
case'delete-record':sheet={type:'delete'};renderOverlay();break;
case'confirm-delete':{const r=state.records.find(r=>r.id===draft.id);if(r)r.deleted=true;draft=null;sheet=null;route={view:'home'};stack=[];state.selectionTouched=false;ensureSelection();persist();render();toast('已移入最近删除，可从右上角菜单恢复。');break;}
case'trash':sheet=null;go('trash');break;
case'restore-record':{let r=state.records.find(r=>r.id===id);if(r)r.deleted=false;state.selectionTouched=false;ensureSelection();persist();render();toast('票据已恢复。');break;}
case'profile':sheet=null;openProfile();break;
case'save-profile':{if(!profileDraft?.name.trim()||!profileDraft?.department.trim()){$('#profile-error').innerHTML='<div class="error">请填写本人姓名和所属部门。</div>';break;}state.profile={name:profileDraft.name.trim(),department:profileDraft.department.trim()};profileDraft=null;persist();log('本人资料已保存');back();toast('资料已保存，之后的报销明细会自动带入。');break;}
case'check-receipts':if(drafts().length)beginEdit(drafts()[0].id,true);else go('list');break;
case'check-times':if(missing().length===1){let r=selected().find(r=>r.date===missing()[0]);beginEdit(r.id,true);}else go('times');break;
case'invoices':go('invoices');break;
case'pick-invoice':invoiceMonth=state.month;$('#invoice-files').value='';$('#invoice-files').click();break;
case'sample-invoice':state.invoices.push({id:uid(),month:state.month,name:`餐饮发票 ${String(invoices().length+1).padStart(2,'0')}.pdf`,data:null,demo:true});persist();render();toast('已加入一份示例发票。');break;
case'view-invoice':openInvoice(state.invoices.find(i=>i.id===id));break;
case'remove-invoice':state.invoices=state.invoices.filter(i=>i.id!==id);persist();render();toast('已从本月移除；历史报销包不变。');break;
case'selection':ensureSelection();go('selection');break;
case'toggle-selection':state.selectionTouched=true;if(state.selected.includes(id))state.selected=state.selected.filter(i=>i!==id);else state.selected.push(id);persist();{let pos=$('#screen').scrollTop;render();$('#screen').scrollTop=pos;}break;
case'all-select':state.selectionTouched=true;state.selected=selected().length===eligible().length?[]:eligible().map(r=>r.id);persist();render();break;
case'selection-done':back();break;
case'layout':sheet={type:'layout'};renderOverlay();break;
case'lodging-info':sheet={type:'lodging'};renderOverlay();break;
case'generate':generate();break;
case'quick-demo':quickDemo();break;
case'download-zip':downloadReport('zip');break;
case'download-pdf':downloadReport('pdf');break;
case'download-xlsx':downloadReport('xlsx');break;
case'delete-report':sheet={type:'delete-report',id};renderOverlay();break;
case'confirm-delete-report':{const rid=sheet.id;state.reports=state.reports.filter(r=>r.id!==rid);exportedFiles.delete(rid);if(completedReportID===rid){completedReportID=null;exportStatus='';}sheet=null;persist();render();toast('已删除报销包，原始票据保留。');break;}
case'history':sheet=null;go('history');break;
case'open-report':if(completedReportID===id){completedReportID=null;exportStatus='';}go('generated',{id});break;
case'preview-xlsx':sheet=null;preview={type:'xlsx'};renderOverlay();break;
case'preview-pdf':sheet=null;preview={type:'pdf'};renderOverlay();break;
case'report-invoice':openInvoice(currentReport().invoices.find(i=>i.id===id));break;
case'share':sheet={type:'share'};renderOverlay();break;
case'submitted':{let r=currentReport();r.submitted=!r.submitted;for(const original of r.records){const record=state.records.find(x=>x.id===original.id);if(record)record.submitted=r.submitted;}state.selectionTouched=false;ensureSelection();persist();render();toast(r.submitted?'已手动标记提交。':'已撤销提交标记。');break;}
case'close-preview':preview=null;renderOverlay();break;
case'close-sheet':sheet=null;renderOverlay();break;
case'close-shade':if(el.classList.contains('sheet-shade')){sheet=null;renderOverlay();}break;
case'scenario':sheet={type:'reset',mode:val};renderOverlay();break;
case'confirm-reset':clearTimeout(busyTimer);state=fresh(val==='empty');draft=null;profileDraft=null;route={view:'home'};stack=[];sheet=null;preview=null;persist();render();toast(val==='empty'?'从空票夹开始，先收一张票吧。':'示例流程已重置。');break;
case'copy-feedback':{const text=`餐费小袋 · 交互原型反馈\n\n${state.feedback||'暂未记录卡点'}\n\n最近操作：\n${state.log.join('\n')}`;if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast('已复制体验反馈。')).catch(()=>fallbackCopy(text));else fallbackCopy(text);break;}
case'open-pdf-original':{let data=preview.invoice.data;let [header,b64]=data.split(',');let bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));let url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000);break;}
}}
function fallbackCopy(text){const a=document.createElement('textarea');a.value=text;document.body.append(a);a.select();document.execCommand('copy');a.remove();toast('已复制体验反馈。');}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target||target.disabled)return;if(target.dataset.action==='close-shade'&&e.target!==target)return;e.preventDefault();dispatch(target.dataset.action,target);});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.field&&draft){const field=t.dataset.field;draft[field]=t.value;draft.dirty=true;if(draft.ocrConflicts){const k=field==='amount'?'amount':field==='date'?'date':field==='merchant'?'merchant':null;if(k)draft.ocrConflicts[k]=false;}if(field==='amount'){draft.amountManual=true;const hint=$('#amount-hint');if(hint)hint.textContent='金额已手动修改';}if(field==='date'){draft.endTime=state.times[t.value]||'';draft.lodging=state.lodging[t.value]?currency(state.lodging[t.value]):'';const time=$('[data-field="endTime"]'),lod=$('[data-field="lodging"]');if(time)time.value=draft.endTime;if(lod)lod.value=draft.lodging;}if(['amount','date'].includes(field)&&$('#draft-cap'))$('#draft-cap').textContent=draftCap();}if(t.dataset.profile){profileDraft??=copy(state.profile);profileDraft[t.dataset.profile]=t.value;}if(t.id==='feedback'){state.feedback=t.value;persist();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(preview){preview=null;renderOverlay();}else if(sheet){sheet=null;renderOverlay();}}});
$('#receipt-files').addEventListener('change',e=>importReceipts([...e.target.files]));$('#invoice-files').addEventListener('change',e=>importInvoices([...e.target.files]));
ensureSelection();render();
})();
</script>
</body>
</html>
